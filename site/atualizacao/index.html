<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="O Catálogo de Políticas da Rede EJA está temporariamente em atualização.">
  <meta name="theme-color" content="#665a91">
  <title>Catálogo em atualização | Rede EJA</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #252334; background: #f6f5fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .container { width: min(100% - 3rem, 68rem); margin-inline: auto; }
    header { padding-block: 1.5rem; background: #fff; border-bottom: 1px solid #dfdce8; }
    .logo { display: block; width: 270px; max-width: 100%; height: auto; }
    main { flex: 1; padding-block: clamp(3rem, 10vw, 8rem); }
    .editoria { margin: 0 0 1rem; color: #665a91; font-size: 1rem; font-weight: 600; }
    h1 { max-width: 19ch; margin: 0 0 1.75rem; font-size: clamp(2.25rem, 5vw, 3.5rem); font-weight: 650; line-height: 1.12; letter-spacing: -.025em; }
    p { max-width: 48ch; font-size: 1.1875rem; line-height: 1.65; margin: 0 0 .75rem; }
    footer { padding-block: 1.5rem; border-top: 1px solid #dfdce8; }
    footer p { color: #625f70; font-size: .9375rem; margin: 0; }
    @media (max-width: 420px) { .container { width: calc(100% - 2rem); } .logo { width: 240px; } p { font-size: 1.0625rem; } }
  </style>
</head>
<body>
  <header><div class="container"><img class="logo" src="/catalogo-politicas/assets/rede-eja-logo.svg" width="477" height="100" alt="Rede EJA e Inclusão Produtiva"></div></header>
  <main class="container" data-publicacao="atualizacao">
    <p class="editoria">Catálogo de Políticas</p>
    <h1>Catálogo em atualização</h1>
    <p>O acesso está temporariamente suspenso para atualização.</p>
    <p>A consulta será retomada após a apresentação da nova versão.</p>
  </main>
  <footer><div class="container"><p>Rede EJA e Inclusão Produtiva</p></div></footer>
</body>
</html>
