name: Build & Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/derived/latest.json'
      - '.claude/context/policies-schema.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/derived/latest.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate each ficha in latest.json against schema v0.2
        run: |
          python <<'PYEOF'
          import json, sys
          from jsonschema import Draft7Validator
          schema = json.load(open('.claude/context/policies-schema.json', encoding='utf-8'))
          data = json.load(open('data/derived/latest.json', encoding='utf-8'))
          if not isinstance(data, list):
              print(f"ERRO: latest.json deve ser array; obtido {type(data).__name__}")
              sys.exit(1)
          validator = Draft7Validator(schema)
          errors = []
          for i, item in enumerate(data):
              for err in validator.iter_errors(item):
                  errors.append(f"#{i} ({item.get('slug', '?')}): {err.message} [path={list(err.absolute_path)}]")
          if errors:
              for e in errors[:20]:
                  print(e)
              if len(errors) > 20:
                  print(f"... +{len(errors)-20} more")
              print(f"\n{len(errors)} erros de schema em {len(data)} fichas")
              sys.exit(1)
          print(f"OK: {len(data)} fichas validam contra schema v0.2")
          PYEOF

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit (high+critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build (Eleventy + Tailwind + Pagefind)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

      - name: Upload _site/ for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site/_site
          retention-days: 1

  a11y:
    name: A11y pa11y-ci (bloqueante WCAG2AA)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
      - name: Download _site
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site/_site
      - name: Install pa11y-ci + http-server
        run: npm install --no-save pa11y-ci http-server
      - name: Serve _site/ em /catalogo-politicas/
        run: |
          mkdir -p _serve/catalogo-politicas
          cp -r _site/* _serve/catalogo-politicas/
          npx http-server _serve -p 8080 -s &
      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -fs http://localhost:8080/catalogo-politicas/ > /dev/null; then
              echo "server ready"; break
            fi
            sleep 1
          done
      - name: Run pa11y-ci
        run: npx pa11y-ci --config .pa11yci.json

  lighthouse:
    name: Lighthouse-CI (bloqueante)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (regenerate _site for LHCI)
        run: npm run build
      - name: Run Lighthouse-CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [a11y, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4