[pytest]
testpaths = tests
python_files = test_*.py toy_*.py unit_*.py integration_*.py
python_classes = Test* Toy* Unit* Integration*
python_functions = test_* toy_* unit_*
addopts = -ra --strict-markers
markers =
    integration: testes de integração que rodam o pipeline completo (lentos)
filterwarnings =
    ignore::DeprecationWarning:openpyxl.*
    ignore::UserWarning:openpyxl.*
